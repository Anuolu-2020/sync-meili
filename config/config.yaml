database:
  type: "postgres"
sync:
  enabled: true
  connection:
    max_retries: 3
    retry_backoff: "2s"
  events:
    event_types:
      - "insert"
      - "update"
      - "delete"
  mappings:
    - database_table: "repos"
      meilisearch_index: "repos"
      meilisearch_index_document_uid: "id"
      fields:
        - "id"
        - "name"
